name: hotel_booking_app
description: "A Flutter project for booking hotel"
publish_to: 'none' 

version: 1.0.0+1

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_svg: ^2.0.17
  google_fonts: ^6.2.1
  firebase_core: ^3.13.0
  firebase_auth: ^5.5.2
  firebase_ui_auth: ^1.16.1
  firebase_ui_oauth_google: ^1.4.1
  google_sign_in: ^6.3.0
  intl: ^0.19.0
  table_calendar: ^3.1.3
  google_nav_bar: ^5.0.7
  gap: ^3.0.1
  readmore: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

flutter:

  uses-material-design: true

  assets:
    - assets/svg/
    - assets/svg/icons/
    - assets/images/
